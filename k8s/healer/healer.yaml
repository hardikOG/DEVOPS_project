apiVersion: v1
kind: ServiceAccount
metadata:
  name: healer
  namespace: self-healing
---
# Least privilege: the healer can only touch workloads in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healer
  namespace: self-healing
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healer
  namespace: self-healing
subjects:
  - {kind: ServiceAccount, name: healer, namespace: self-healing}
roleRef:
  {apiGroup: rbac.authorization.k8s.io, kind: Role, name: healer}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer
  namespace: self-healing
  labels: {app: healer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: healer}
  template:
    metadata:
      labels: {app: healer}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: healer
      containers:
        - name: healer
          image: self-healing/healer:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: healer-config}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: healer
  namespace: self-healing
  labels: {app: healer}
spec:
  type: NodePort
  selector: {app: healer}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30080}]
