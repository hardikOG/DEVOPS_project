apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: self-healing
  labels: {app: loadgen}
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: self-healing/demo-service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: MODE, value: loadgen}
            - {name: LOADGEN_RPS, value: "10"}
            - {name: LOADGEN_TARGETS, value: "http://orders:8000,http://payments:8000,http://inventory:8000"}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 300m, memory: 128Mi}
