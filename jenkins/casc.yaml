jenkins:
  systemMessage: "Aegis self-healing platform CI/CD - pipeline defined in Jenkinsfile"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

jobs:
  - script: |
      pipelineJob('aegis-self-healing') {
        description('Test, build, deploy and chaos-verify the self-healing platform')
        properties { disableConcurrentBuilds() }
        definition {
          cpsScm {
            scm {
              git {
                remote { url(System.getenv('REPO_URL') ?: 'file:///src') }
                branch(System.getenv('REPO_BRANCH') ?: '*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
        triggers { scm('H/2 * * * *') }
      }
